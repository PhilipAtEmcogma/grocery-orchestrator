# Continuous integration.
#
# NO AWS CREDENTIALS ARE USED OR NEEDED. That is a design outcome, not a
# limitation: the orchestrator depends on protocol boundaries over the price
# store and the model plane, with fixture implementations behind them. Every
# job below runs in seconds, costs nothing, and is deterministic.
#
# What this DOES gate: structural correctness, the contract, the grounding
# invariant, security scanning, regression floors on both eval suites measured
# against the scripted client, and -- since 2026-08-31 -- the CDK definitions
# in `infra/`, which had no gate of any kind while being the place the security
# posture is declared.
#
# What it does NOT gate: real model quality. Scoring Claude or Nova requires
# credentials and costs money per run, so it is a deliberate manual step
# (`python evals/run_intent.py --compare ...`) recorded in the pull request,
# not something that runs on every push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      # Formatting is gated, as of 2026-08-29. It was not, and the drift had
      # reached 59 of 104 files -- growing with the repo, and guaranteeing that
      # whenever it was adopted the diff would land on top of whatever was in
      # flight. Adopting it against a clean main was the cheapest that ever
      # got. `line-length = 100` in pyproject.toml is shared with the linter,
      # so the two cannot disagree.
      #
      # If this fails: run `ruff format .` and commit. It never needs a
      # judgement call, which is the point of gating it.
      - name: Format
        run: ruff format --check --diff .

      # Ruff does not check types. The Telemetry protocol declared span() as
      # returning None while both implementations returned a context manager,
      # so neither satisfied the protocol — ten errors that ruff and the tests
      # could not see, because a Protocol is verified statically or not at all.
      # Config is in pyproject.toml [tool.pyright], shared with the pre-commit
      # hook and the editor, so all three check the same files the same way.
      #
      # Plain output, not `--output-format=github` like ruff above: pyright
      # 1.1.411 has no such flag (only `--outputjson`), and passing one it
      # does not know is a failure that only appears in CI.
      #
      # `--stats` for one line: "Found N source files". Without it the log
      # says "0 errors" whether it analysed the repo or nothing at all, and a
      # config that silently resolved to an empty file set would look exactly
      # like a passing type check. The count is the evidence that it ran.
      #
      # NODE IS DELIBERATELY NOT PINNED, and not installed by a setup-node
      # step. pyright is a TypeScript program and Node is only its interpreter:
      # what it reports is fixed by the pyright version and the typeshed it
      # bundles, both pinned in requirements-dev.txt. A Node change can stop
      # pyright running — loudly, as a failed step — but cannot quietly change
      # a verdict, which is the drift that pinning ruff exists to prevent. The
      # runner's own Node is used (no download in the log); local runs here use
      # Node 22 and produce byte-identical output: 53 files, same version, same
      # zero. If this step ever fails on Node, pin it then, and pin it to a
      # version, not to whatever fixes the build that day.
      - name: Type check
        run: pyright --stats

      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing

  contract:
    name: Contract and grounding invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # Separate job so a contract break is legible in the checks list rather
      # than buried in a test summary. This is the published interface the
      # frontend builds against.
      - name: Validate samples and grounding
        run: python validate.py

      - name: Regenerate fixtures and confirm no drift
        run: |
          python scripts/generate_fixtures.py
          git diff --exit-code fixtures/ || {
            echo "::error::fixtures/products.json is out of sync with its generator."
            echo "Run: python scripts/generate_fixtures.py"
            exit 1
          }

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Dependency vulnerabilities
        run: pip-audit --strict

      # `detect-secrets scan --baseline` is NOT a gate: it rewrites the
      # baseline in place and exits 0 even when it finds something new. The
      # hook subcommand is the one that exits non-zero. This job was green for
      # both wrong reasons before — that command, and a baseline that was
      # gitignored, so every clean checkout regenerated the file it was
      # supposed to be compared against.
      # Runs BEFORE the scan, because a non-canonical baseline makes the scan
      # below fail with "a new secret was detected" for every recorded false
      # positive — a diagnosis that sends the reader looking for a secret that
      # is not there. Ordering it first turns that into one accurate line.
      #
      # WHY IT IS NEEDED HERE AND NOT ONLY IN THE HOOK. detect-secrets writes
      # `filename` with the local os.sep, so a rescan on Windows produces
      # `tests	est_handler.py`. Those are read correctly on any platform, but
      # this job matches the forward-slash paths `git ls-files` emits on
      # ubuntu, so a backslash baseline reads as all-new secrets. It passes on
      # the author's machine and fails only in CI — which is the failure mode
      # the pre-commit hook exists to prevent, and the hook only protects
      # clones that ran `git config core.hooksPath scripts/hooks`.
      #
      # Not hypothetical: it happened twice while adopting `ruff format`.
      #
      # The script exits 0 when the file was already canonical and 1 when it
      # rewrote it, so its exit status IS the check. Written as an explicit
      # `if` rather than the `git diff --exit-code` form originally sketched in
      # docs/CI-GATE-HEALTH.md §2, because under `bash -e` the script's own
      # non-zero exit would end the step before any diff could report why.
      - name: Baseline is canonical
        run: |
          if ! python scripts/normalise_secrets_baseline.py; then
            echo "::error::.secrets.baseline is not in canonical form. It was"
            echo "probably rescanned on Windows, which writes backslash paths."
            echo "Fix: python scripts/normalise_secrets_baseline.py && git add .secrets.baseline"
            git --no-pager diff -- .secrets.baseline | head -40
            exit 1
          fi

      - name: Secret scan
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline || {
            echo "::error::Secret scan failed. Either a new secret was"
            echo "detected, or the baseline moved and needs re-committing."
            echo "Inspect, then: detect-secrets audit .secrets.baseline"
            exit 1
          }

      # The guardrail is our content-safety control and it is configuration.
      # Validating it here means a policy that would silently do nothing —
      # PROMPT_ATTACK below HIGH, a topic with too few examples — fails the
      # build rather than being discovered in production.
      - name: Validate guardrail policy
        run: python scripts/apply_guardrail.py --dry-run

      # The alarms are the other control that is configuration rather than
      # console state, and they fail the same way: an alarm on a metric no
      # filter publishes, or one that needs two crashes to fire, deploys clean
      # and reads as a healthy service. tests/test_alarms.py additionally
      # checks the filter pattern against the log line the handler really
      # emits, which is the drift AWS cannot see.
      - name: Validate alarm policy
        run: python scripts/apply_alarms.py --dry-run

  evals:
    name: Evaluation floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # Floors are set at the current scripted baseline. They catch structural
      # regressions — a broken constraint reconciler, a lost exclusion — not
      # prompt quality, which needs a real model. Raise a floor when the
      # baseline genuinely improves; never lower one to make a build pass.
      - name: Intent classification
        run: python evals/run_intent.py --min-accuracy 0.75

      - name: Meal plan invariants
        run: python evals/run_meal_plan.py --min-pass-rate 0.90

      # Both added 2026-08-29, when recording scorecards showed generate_prose
      # and repair_plan were routed to models nothing had scored. Scripted
      # baselines are 100%, so 0.90 leaves one case of headroom on each -- and
      # the prose suite has 11 cases, the repair suite 6, so read a drop as a
      # signal to look rather than a precise measurement.
      - name: Prose rule compliance
        run: python evals/run_prose.py --min-pass-rate 0.90

      # Repair became TWO tasks on 2026-08-31 (repair_budget, repair_defect) and
      # the floor applies to EACH half, not to the average -- a model perfect at
      # one and weak at the other clears a combined bar comfortably, which is
      # the shape the split exists to describe.
      - name: Repair pass
        run: python evals/run_repair.py --min-pass-rate 0.90

      # Recipe selection, added with the task it scores (Pilot Task 15c). The
      # rule here is that a new routed task arrives with its suite, not after
      # it: `config/models.json` records select_recipes as the file's ONE
      # exemption, and it is exempt from the LIVE scorecard rather than from
      # having a suite at all. Every case was verified to discriminate against a
      # model built to fail it -- a fabricated id scores 0%, a repeated
      # selection 8.3%, an under-count 0%, against a 100% scripted baseline.
      - name: Recipe selection
        run: python evals/run_recipe_select.py --min-pass-rate 0.90

  package:
    name: Lambda deployment package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # ubuntu-latest is natively manylinux2014_x86_64, so both the size
      # measurement and the import check this script does are authoritative
      # here — unlike a developer running the same script on Windows, which
      # cannot load the compiled Linux wheels it just downloaded.
      - name: Build
        run: python scripts/build_lambda.py

      # v7, not v5: v5 declares `using: node20`, which the runner force-runs
      # on Node 24 and annotates every build about. It was the only warning on
      # an otherwise clean run, and a warning that is always present is one
      # nobody reads — so a genuinely new one had nowhere to be noticed.
      # v7.0.1 declares `using: node24`; every other action here is on v7.
      - uses: actions/upload-artifact@v7
        with:
          name: lambda-package
          path: build/lambda.zip

  infra:
    name: CDK synth and security assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # NO AWS CREDENTIALS, like every other job here. `cdk synth` renders a
      # template from the code and never calls an account; the test file passes
      # an explicit `env` so nothing has to be looked up.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install
        working-directory: infra
        run: npm ci

      # WHY THIS JOB EXISTS. Until 2026-08-31 nothing in CI touched `infra/` at
      # all -- no compile, no jest, no synth -- so a broken stack merged green.
      # That mattered more than it sounds: `infra/lib/service-stack.ts` is where
      # this project's security posture is DEFINED (scoped IAM, no write on
      # products, X-Ray-only wildcard, log retention, no request-body logging),
      # and it was the only code in the repository with no gate under it. When
      # the suite was finally run it found two IAM regressions in a stack that
      # was already deployed. See the header of infra/test/service-stack.test.ts.
      #
      # The Lambda archive is needed because ServiceStack points
      # `lambda.Code.fromAsset` at build/lambda.zip -- synth reads it to
      # fingerprint the asset. Building it here rather than downloading the
      # `package` job's artifact keeps this job independent: a failure is about
      # infra, not about job ordering.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the Lambda asset synth points at
        run: python scripts/build_lambda.py

      # Types first: a compile error is a clearer message than the same mistake
      # surfacing as a jest failure inside ts-jest.
      - name: Type check
        working-directory: infra
        run: npx tsc --noEmit

      - name: Security assertions
        working-directory: infra
        run: npm test

      # Synth is a distinct check from the tests, not a duplicate of them. The
      # tests instantiate two stacks directly; `cdk synth` walks the app
      # entrypoint, so it is what catches a stack that is broken only when
      # `bin/grocery.ts` wires it -- and it is where publishJson's size guard
      # fires for a config file that has outgrown its SSM tier.
      # `cdk synth` with no stack id synthesises all five. `--all` is not an
      # option on this CLI version and is silently IGNORED with a warning, which
      # would have made this step look like it covered more than it did.
      - name: Synth every stack
        working-directory: infra
        run: npx cdk synth --quiet

  summary:
    name: All checks
    runs-on: ubuntu-latest
    needs: [quality, contract, security, evals, package, infra]
    if: always()
    steps:
      # A single job to require in branch protection, so adding a job later
      # does not mean reconfiguring the protection rule.
      - name: Verify
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::One or more checks failed."
            exit 1
          fi
          echo "All checks passed."
