[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit — security linting
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"validate.py" = ["BLE001"]
"tests/*" = ["S101"]
