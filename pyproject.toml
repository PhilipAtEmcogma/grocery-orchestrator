[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
# Config lives here rather than in the invocations, so the hook, CI and the
# editor all check the same files under the same rules. A type checker
# configured per-caller is a type checker that disagrees with itself.
#
# `build/` MUST stay excluded: it holds the vendored Lambda runtime (boto3,
# botocore — tens of thousands of files), and scanning it turns a 4-second
# check into a very long one for third-party code we do not own.
include = ["src", "tests", "evals", "scripts", "validate.py"]
exclude = ["build", ".venv", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# `scripts/` is not a package and is deliberately not shipped in the Lambda
# archive, so its shared helpers are imported after a sys.path insert. That is
# a runtime fact pyright cannot see — it does not execute the insert — so the
# path is declared here instead. Without it, `from aws_placeholders import ...`
# in scripts/ and tests/ is an unresolved import and the type gate fails on
# code that runs correctly.
extraPaths = ["scripts"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E","W","F","I","UP","B","S","A","C4","PTH","RUF"]

[tool.ruff.lint.per-file-ignores]
"validate.py" = ["BLE001"]
"tests/*" = ["S101", "S105"]
